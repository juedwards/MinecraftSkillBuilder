[project]
name = "minecraft-skill-builder"
version = "0.2.0"
description = "Minecraft Education AI companion: chat, build, villages and rubric-based assessments, powered by Azure AI Foundry"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websockets>=14",
    "openai>=1.60",
    "python-dotenv>=1.0",
    "quickjs>=1.19.4",
    "aiohttp>=3.14.3",
    "prompt-toolkit>=3.0.43",
]

[project.scripts]
skillbuilder = "mcchat.cli:main"
mcchat = "mcchat.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcchat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
